<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milky Marble - Budget</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Urbanist:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/budget.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="brand-section">
                <div class="brand-logo-wrap">
                    <img src="../images/logo.png" alt="Milky Marble Logo" class="brand-logo-img" style="max-width: 70px; max-height: 70px; width: 100%; object-fit: contain;">
                </div>
                <h2 class="brand-title">Milky Marble</h2>
            </div>

            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">
                    <i class="fa-solid fa-border-all"></i>
                    <span>Dashboard</span>
                </a>
                <a href="revenue.html" class="nav-item">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Revenue</span>
                </a>
                <a href="budget.html" class="nav-item active">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Budget</span>
                </a>
                <a href="expenses.html" class="nav-item">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>Expenses</span>
                </a>
                <a href="payments.html" class="nav-item">
                    <i class="fa-solid fa-money-bill-transfer"></i>
                    <span>Payments</span>
                </a>
            </nav>

            <div class="logout-item">
                <a href="../login.html" class="nav-item">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Log out</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="search-box">
                    <input type="text" placeholder="Search for anything...">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div class="topbar-right">
                    <div class="user-profile">
                        <div class="user-avatar">
                            <img id="userAvatar" src="../images/account.png" alt="User Avatar" class="user-avatar-img" onerror="this.onerror=null; this.src='../images/account.png';">
                        </div>
                        <span id="userName" class="user-name">Loading...</span>
                    </div>
                </div>
            </header>

            <section class="budget-card">
                <table class="budget-table">
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>CAPITAL</th>
                            <th>RAW MATERIAL</th>
                            <th>EMERGENCY FUNDS</th>
                            <th>MANPOWER COST</th>
                        </tr>
                    </thead>
                    <tbody id="budgetTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 20px;">Loading budget records...</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="js/budget.js"></script>
</body>
</html>
